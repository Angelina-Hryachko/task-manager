<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Task Manager - Login</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Task Manager</h1>

        <h2>Welcome Back</h2>

        <p class="auth-subtitle">
            Login to manage your tasks
        </p>
        
        <div class="login-error"
             th:if="${param.error}">
            Invalid username or password
        </div>

        <form th:action="@{/users/login}"
              th:object="${user}"
              method="post">

            <div class="form-group">

                <label for="username">
                    Username:
                </label>

                <input type="text"
                       id="username"
                       name="username"
                       required
                       placeholder="Enter username">

                <div class="error-message"
                     th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}">
                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    Password:
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       required
                       placeholder="Enter password">

                <div class="error-message"
                     th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}">
                </div>

            </div>


            <button type="submit"
                    class="auth-button">
                Login
            </button>

        </form>


        <p class="auth-footer">
            Don't have an account?
            <a th:href="@{/users/register}">
                Register
            </a>
        </p>

    </div>

</div>

</body>
</html>
