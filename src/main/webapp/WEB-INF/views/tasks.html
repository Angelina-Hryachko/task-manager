<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <link rel="stylesheet" th:href="@{/css/tasks.css}">
</head>

<body>

<div class="top-bar">
    <form th:action="@{/users/logout}" method="post">
        <button type="submit" class="logout-button">
            Logout
        </button>
    </form>
</div>

<div class="container">

    <h1>Task Manager</h1>

    <div class="add-task">

        <h2>Add Task</h2>

        <form th:action="@{/tasks}"
              th:object="${task}"
              method="post">

            <div class="form-group">

                <label>Title:</label>

                <input type="text"
                       th:field="*{title}"
                       th:classappend="${#fields.hasErrors('title')} ? ' error' : ''"
                       placeholder="Enter task title">

                <div class="error-message"
                     th:if="${#fields.hasErrors('title')}"
                     th:errors="*{title}">
                </div>

            </div>


            <div class="form-group">

                <label>Description:</label>

                <textarea th:field="*{description}"
                          placeholder="Enter task description"></textarea>

            </div>


            <button type="submit">
                Add Task
            </button>

        </form>

    </div>



    <h2>Tasks</h2>


    <div th:if="${#lists.isEmpty(tasks)}"
         class="empty">

        No tasks yet.

    </div>


    <div th:each="task : ${tasks}"
         class="task">

        <h3 th:text="${task.title}">
            Task title
        </h3>


        <p th:text="${task.description}">
            Description
        </p>


        <p class="status">

            Status:

            <span th:if="${task.completed}">
                Completed
            </span>

            <span th:unless="${task.completed}">
                Not completed
            </span>

        </p>


        <div class="task-actions">

            <form th:action="@{/tasks/{id}/toggle(id=${task.id})}"
                  method="post">

                <button type="submit">
                    Toggle status
                </button>

            </form>


            <form th:action="@{/tasks/{id}/delete(id=${task.id})}"
                  method="post">

                <button type="submit"
                        class="delete-button">

                    Delete

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
